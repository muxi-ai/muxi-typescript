name: TypeScript SDK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ts-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        env:
          MUXI_SDK_E2E_SERVER_URL: ${{ secrets.MUXI_SDK_E2E_SERVER_URL }}
          MUXI_SDK_E2E_KEY_ID: ${{ secrets.MUXI_SDK_E2E_KEY_ID }}
          MUXI_SDK_E2E_SECRET_KEY: ${{ secrets.MUXI_SDK_E2E_SECRET_KEY }}
          MUXI_SDK_E2E_FORMATION_ID: ${{ secrets.MUXI_SDK_E2E_FORMATION_ID }}
          MUXI_SDK_E2E_CLIENT_KEY: ${{ secrets.MUXI_SDK_E2E_CLIENT_KEY }}
          MUXI_SDK_E2E_ADMIN_KEY: ${{ secrets.MUXI_SDK_E2E_ADMIN_KEY }}
        run: |
          : "${MUXI_SDK_E2E_SERVER_URL:?set MUXI_SDK_E2E_SERVER_URL}"
          : "${MUXI_SDK_E2E_KEY_ID:?set MUXI_SDK_E2E_KEY_ID}"
          : "${MUXI_SDK_E2E_SECRET_KEY:?set MUXI_SDK_E2E_SECRET_KEY}"
          : "${MUXI_SDK_E2E_FORMATION_ID:?set MUXI_SDK_E2E_FORMATION_ID}"
          : "${MUXI_SDK_E2E_CLIENT_KEY:?set MUXI_SDK_E2E_CLIENT_KEY}"
          : "${MUXI_SDK_E2E_ADMIN_KEY:?set MUXI_SDK_E2E_ADMIN_KEY}"
          npm run test:e2e

  version:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Compute next version (ScalVer)
        id: version
        run: |
          current=$(node -e "const fs=require('fs'); const m=fs.readFileSync('src/version.ts','utf8').match(/version\s*=\s*\"([^\"]+)\"/); if(!m) { process.exit(1);} console.log(m[1]);")
          major=$(echo "$current" | cut -d. -f1)
          cdate=$(echo "$current" | cut -d. -f2)
          cpatch=$(echo "$current" | cut -d. -f3)
          today=$(date -u +%Y%m%d)
          if [ "$cdate" = "$today" ]; then
            nextpatch=$((cpatch + 1))
          else
            nextpatch=0
          fi
          next="${major}.${today}.${nextpatch}"
          echo "version=$next" >> $GITHUB_OUTPUT
          node -e "const fs=require('fs'); const next=process.env.NEXT||'$next'; const path='src/version.ts'; const text=fs.readFileSync(path,'utf8').replace(/version\s*=\s*\"[^\"]+\"/, 'version = \"'+next+'\"'); fs.writeFileSync(path,text);"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.ts
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.MUXI_NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body: |
            TypeScript SDK v${{ needs.version.outputs.version }}

  sync_develop:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Merge main into develop
        run: |
          git fetch origin main develop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit
          git push origin HEAD:develop

  update_sdks_pointer:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    needs: sync_develop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout parent sdks repo
        uses: actions/checkout@v4
        with:
          repository: muxi-ai/sdks
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}
          path: sdks

      - name: Update typescript submodule to latest main
        run: |
          cd sdks
          git config --global url."https://x-access-token:${{ secrets.MUXI_RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config submodule.typescript.url https://github.com/muxi-ai/muxi-typescript.git
          git submodule update --init --depth 1 typescript
          cd typescript
          git fetch origin main --depth 1
          git reset --hard FETCH_HEAD
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add typescript
          if git diff --cached --quiet; then
            echo "No submodule pointer change"
          else
            git commit -m "Update typescript submodule pointer"
            git push origin main
          fi
