name: TypeScript SDK Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run test job"
        type: boolean
        default: true
      run_publish:
        description: "Publish to npm"
        type: boolean
        default: true
      run_sync:
        description: "Sync main->develop"
        type: boolean
        default: true
      run_pointer:
        description: "Update sdks pointer"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ts-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') && (github.event_name == 'push' || inputs.run_tests) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MUXI_SDK_E2E_SERVER_URL: ${{ secrets.MUXI_SDK_E2E_SERVER_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Require test server
        run: |
          if [ -z "$MUXI_SDK_E2E_SERVER_URL" ]; then
            echo "::error::MUXI_SDK_E2E_SERVER_URL secret is not set"
            exit 1
          fi
          if ! curl -sf --max-time 10 "${MUXI_SDK_E2E_SERVER_URL}/ping" >/dev/null 2>&1 && \
             ! curl -sf --max-time 10 "${MUXI_SDK_E2E_SERVER_URL}" >/dev/null 2>&1; then
            echo "::error::Test server is not reachable at ${MUXI_SDK_E2E_SERVER_URL}"
            exit 1
          fi

      - name: E2E tests
        env:
          MUXI_SDK_E2E_KEY_ID: ${{ secrets.MUXI_SDK_E2E_KEY_ID }}
          MUXI_SDK_E2E_SECRET_KEY: ${{ secrets.MUXI_SDK_E2E_SECRET_KEY }}
          MUXI_SDK_E2E_FORMATION_ID: ${{ secrets.MUXI_SDK_E2E_FORMATION_ID }}
          MUXI_SDK_E2E_CLIENT_KEY: ${{ secrets.MUXI_SDK_E2E_CLIENT_KEY }}
          MUXI_SDK_E2E_ADMIN_KEY: ${{ secrets.MUXI_SDK_E2E_ADMIN_KEY }}
        run: npm run test:e2e

  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') && (github.event_name == 'push' || inputs.run_publish) }}"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Compute next version
        id: version
        run: |
          python3 - <<'PY'
          import json, re, datetime, os
          from pathlib import Path

          version_path = Path('src/version.ts')
          m = re.search(r'version\s*=\s*"([^"]+)"', version_path.read_text())
          if not m:
              raise SystemExit("version not found")
          current = m.group(1)
          major, cdate, cpatch = current.split('.')
          today = datetime.datetime.utcnow().strftime('%Y%m%d')
          patch = int(cpatch) + 1 if cdate == today else 0
          next_version = f"{major}.{today}.{patch}"

          version_path.write_text(f'export const version = "{next_version}";\n')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['version'] = next_version
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          lock_path = Path('package-lock.json')
          if lock_path.exists():
              lock = json.loads(lock_path.read_text())
              lock['version'] = next_version
              if '' in lock.get('packages', {}):
                  lock['packages']['']['version'] = next_version
              lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          out_path = os.environ.get('GITHUB_OUTPUT')
          if not out_path:
              raise SystemExit('GITHUB_OUTPUT not set')
          with open(out_path, 'a', encoding='utf-8') as fh:
              fh.write(f"version={next_version}\n")
          PY

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.ts package.json package-lock.json || true
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            TypeScript SDK v${{ steps.version.outputs.version }}

  sync_develop:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') && (github.event_name == 'push' || inputs.run_sync) }}"
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}

      - name: Merge main into develop
        run: |
          git fetch origin main develop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit -m "chore: sync main to develop [skip ci]"
          git push origin HEAD:develop

  update_sdks_pointer:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') && (github.event_name == 'push' || inputs.run_pointer) }}"
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout parent sdks repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: muxi-ai/sdks
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MUXI_RELEASE_TOKEN }}
          path: sdks

      - name: Update typescript submodule to latest main
        run: |
          cd sdks
          git config --global url."https://x-access-token:${{ secrets.MUXI_RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config submodule.typescript.url https://github.com/muxi-ai/muxi-typescript.git
          git submodule update --init --depth 1 typescript
          cd typescript
          git fetch origin main --depth 1
          git reset --hard FETCH_HEAD
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add typescript
          if git diff --cached --quiet; then
            echo "No submodule pointer change"
          else
            git commit -m "Update typescript submodule pointer"
            git push origin main
          fi
