name: TypeScript SDK RC

on:
  push:
    branches: [rc]

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
    env:
      MUXI_SDK_E2E_SERVER_URL: ${{ secrets.MUXI_SDK_E2E_SERVER_URL }}
    steps:
      - name: Skip if no test server configured
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL == '' }}
        run: echo "::notice::E2E tests skipped — MUXI_SDK_E2E_SERVER_URL not set"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
        run: npm ci

      - name: E2E tests
        if: ${{ env.MUXI_SDK_E2E_SERVER_URL != '' }}
        env:
          MUXI_SDK_E2E_KEY_ID: ${{ secrets.MUXI_SDK_E2E_KEY_ID }}
          MUXI_SDK_E2E_SECRET_KEY: ${{ secrets.MUXI_SDK_E2E_SECRET_KEY }}
          MUXI_SDK_E2E_FORMATION_ID: ${{ secrets.MUXI_SDK_E2E_FORMATION_ID }}
          MUXI_SDK_E2E_CLIENT_KEY: ${{ secrets.MUXI_SDK_E2E_CLIENT_KEY }}
          MUXI_SDK_E2E_ADMIN_KEY: ${{ secrets.MUXI_SDK_E2E_ADMIN_KEY }}
        run: npm run test:e2e
